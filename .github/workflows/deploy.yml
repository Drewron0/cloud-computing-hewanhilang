name: Deploy Laravel

on:
  push:
    branches:
      - main # Trigger saat push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      TARGET_DIR: ${{ secrets.ROOT_DIRECTORY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: NPM Install & Build
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to VPS via Rsync (Password Auth)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Otomatis bersihkan jika ada https://, http://, atau tanda slash yang tidak sengaja terbawa
          CLEAN_HOST=$(echo "$SSH_HOST" | sed -e 's|^https\?://||' -e 's|/.*||' -e 's/^[[:space:]]*//;s/[[:space:]]*$//')

          sshpass -p "$SSH_PASSWORD" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs' \
            --exclude='storage/app/public' \
            ./ $SSH_USERNAME@$CLEAN_HOST:${{ env.TARGET_DIR }}/

      - name: Run Post-Deploy Artisan Commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          CLEAN_HOST=$(echo "$SSH_HOST" | sed -e 's|^https\?://||' -e 's|/.*||' -e 's/^[[:space:]]*//;s/[[:space:]]*$//')

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$CLEAN_HOST "bash -s" << 'EOF'
            cd ${{ env.TARGET_DIR }}
            php artisan storage:link
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
          EOF
